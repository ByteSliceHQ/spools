      "bun": {
        "pkg-path": "bun"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "postgresql": {
        "pkg-path": "postgresql"
      }
    },
    "hook": {
      "on-activate": "  PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  mkdir -p \"$PGDATA\"\n  if [ ! -f \"$PGDATA/PG_VERSION\" ]; then\n    initdb -D \"$PGDATA\" --auth=trust --username=spools\n  fi\n\n  echo \"Spools: bun install && bun run verify\"\n  echo \"Starter and website:  bun run dev\"\n"
    },
    "options": {},
    "services": {
      "postgres": {
        "command": "  PGDATA=\"$FLOX_ENV_CACHE/postgres\"\n  pg_ctl -D \"$PGDATA\" -o \"-p 5432 -h 127.0.0.1\" start -w\n  createdb -h 127.0.0.1 -p 5432 -U spools spools_test 2>/dev/null || true\n  tail -f /dev/null\n"
      }
    }
  },
