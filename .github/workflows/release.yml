name: Release

on:
  push:
    branches: [main]

# Every action here is pinned to a commit, with its version beside it; Dependabot moves both.

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.repository_owner == 'ByteSliceHQ'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # An exact version: this job may publish, so nothing it runs is whatever was released last.
      - name: Use npm with trusted publishing support
        run: npm install --global npm@12.2.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Open version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version-packages
          publish: bun run release
          title: 'chore(release): publish @swirls/spools'
          commit: 'chore(release): publish @swirls/spools'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
