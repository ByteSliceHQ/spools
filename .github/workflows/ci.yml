name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every action here is pinned to a commit, with its version beside it; Dependabot moves both.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run fmt:check
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun x commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun x commitlint --verbose
      - name: Check changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bun run scripts/check-changeset.ts --base "$BASE_SHA" --head "$HEAD_SHA" --title "$PR_TITLE" --labels "$PR_LABELS"
      - name: Check generated files
        working-directory: apps/starter
        run: |
          bun run crm:gen
          git diff --exit-code -- prisma crm.config.schema.json \
            || (echo "::error::Run 'bun run crm:gen' in apps/starter and commit the result" && exit 1)
      - name: Check types
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build the starter
        working-directory: apps/starter
        run: |
          bun run build
          git diff --exit-code -- src/routeTree.gen.ts \
            || (echo "::error::Run 'bun run build' in apps/starter and commit src/routeTree.gen.ts" && exit 1)

  integration:
    name: integration (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [pglite, postgres, prisma]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spools_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_STORE: ${{ matrix.store }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/spools_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Create the tables
        if: matrix.store != 'pglite'
        working-directory: apps/starter
        run: bun run db:push
      - name: Check that a second push changes nothing
        if: matrix.store != 'pglite'
        working-directory: apps/starter
        run: bun run db:push
      - name: Test
        run: bun run test:integration
      # The example adapter in examples/ is shown in the docs: prove it against a real Postgres.
      - name: Test the example database adapter
        if: matrix.store == 'postgres'
        env:
          EXAMPLES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/spools_test
        run: bun run --cwd examples test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check published packages
        run: bun run check:package --image

  swirls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the Swirls CLI
        run: |
          curl -fsSL https://swirls.ai/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check .swirls files
        working-directory: apps/starter
        run: swirls doctor

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test in a browser
        run: bun run test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/starter/e2e/playwright-report/
            apps/starter/e2e/test-results/
          retention-days: 7

  deploy-docs:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'ByteSliceHQ'
    needs: [verify, integration, package]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build docs
        run: bun x turbo run build --filter=@spools/docs
      - name: Deploy docs
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          packageManager: bun
          wranglerVersion: 4.166.0
          command: deploy --config .output/server/wrangler.json
